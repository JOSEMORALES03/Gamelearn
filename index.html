<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLearn - Aprende Jugando</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Pantalla de Bienvenida para seleccionar el grado -->
    <div id="pantalla-bienvenida" class="contenedor-centrado">
        <div class="tarjeta-bienvenida">
            <h1>¡Bienvenido a GameLearn!</h1>
            <p>Para empezar, selecciona tu grado:</p>
            <div class="seleccion-grado">
                <button class="btn-grado" data-grado="6">6°</button>
                <button class="btn-grado" data-grado="7">7°</button>
                <button class="btn-grado" data-grado="8">8°</button>
                <button class="btn-grado" data-grado="9">9°</button>
                <button class="btn-grado" data-grado="10">10°</button>
                <button class="btn-grado" data-grado="11">11°</button>
            </div>
        </div>
    </div>

    <!-- Pantalla Principal de la aplicación (inicialmente oculta) -->
    <main id="pantalla-principal" style="display: none;">
        <header>
            <div class="header-contenido">
                <span class="logo">GameLearn</span>
                <span id="grado-seleccionado"></span>
                <button id="btn-cambiar-grado">Cambiar Grado</button>
            </div>
        </header>

        <section id="seleccion-materia" class="contenedor-seccion">
            <h2>Elige una materia</h2>
            <div class="grid-materias">
                <div class="tarjeta-materia" data-materia="ingles">
                    <h3>Inglés</h3>
                </div>
                <div class="tarjeta-materia" data-materia="matematicas">
                    <h3>Matemáticas</h3>
                </div>
                <div class="tarjeta-materia disabled" data-materia="ciencias">
                    <h3>Ciencias <small>(Próximamente)</small></h3>
                </div>
            </div>
        </section>

        <section id="seleccion-tema" class="contenedor-seccion" style="display: none;"></section>

        <!-- Pantalla para Crear un Tema Nuevo (inicialmente oculta) -->
        <section id="pantalla-crear-tema" class="contenedor-seccion" style="display: none;">
            <div class="tarjeta-creacion">
                <h2>Crea tu Propio Tema</h2>
                <div class="form-grupo">
                    <label for="nombre-tema-input">Nombre del Tema:</label>
                    <input type="text" id="nombre-tema-input" placeholder="Ej: Verbos Irregulares">
                </div>
                
                <h3>Preguntas (máx. 10)</h3>
                <div id="contenedor-preguntas-crear">
                    <!-- Las preguntas se añadirán aquí dinámicamente -->
                </div>

                <div class="controles-creacion">
                    <button id="btn-agregar-pregunta" class="btn-juego btn-verificar">Añadir Pregunta</button>
                    <button id="btn-guardar-tema" class="btn-juego btn-siguiente">Guardar Tema</button>
                    <button id="btn-cancelar-creacion" class="btn-juego btn-volver">Cancelar</button>
                </div>
            </div>
        </section>

        <section id="contenedor-juego" class="contenedor-seccion" style="display: none;"></section>

    </main>

    <script src="script.js"></script>
</body>
</html>
